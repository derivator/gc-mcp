[project]
name = "gc-mcp"
version = "0.1.0"
description = "MCP server that controls multiple stock (unmodified) Dolphin emulator instances as GameCubes, with a unified interface ready to be pointed at real hardware."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "gc-mcp" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
memory = ["dolphin-memory-engine>=1.3.0"]
ocr = ["rapidocr>=3.10.0", "onnxruntime>=1.17"]
all = [
    "dolphin-memory-engine>=1.3.0",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.17",
]

[project.scripts]
gc-mcp = "gc_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_mcp"]

[tool.uv]
# uv-managed project. Use `uv sync` to install.
